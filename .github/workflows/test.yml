name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd extension && npm ci && npm test && npm run demo
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=bench python -m unittest discover -s bench -v
